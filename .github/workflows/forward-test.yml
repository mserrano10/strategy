name: Forward test marks

on:
  schedule:
    # 21:30 UTC weekdays, after both the 20:00 UTC (EDT) and 21:00 UTC (EST) cash closes.
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r backtest-lab/requirements.txt

      - name: Mark the frozen forward test
        working-directory: backtest-lab
        run: python -m backtest_lab forward-mark

      - name: Commit and push marks
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest-lab/forward/picks.json backtest-lab/results/forward-test.json
          git diff-index --quiet HEAD || git commit -m "auto: forward-test mark"
          git push
